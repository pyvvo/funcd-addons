apiVersion: funcd.io/v1alpha1
kind: IdentityProvider
metadata:
  name: login
  namespace: default
  resourceGroup: rg1
spec:
  config:
    publicHost: login.localhost:18091
    rpId: login.localhost
    https: false
  bindings:
    secret:
      - rauthy-keys
  functions:
    - kind: RauthyPasswordPolicy
      ref: rauthy-settings
  ingress:
    host: login.localhost
