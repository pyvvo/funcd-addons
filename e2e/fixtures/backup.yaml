apiVersion: funcd.io/v1alpha1
kind: Bucket
metadata:
  name: backups
  namespace: default
  resourceGroup: rg1
spec:
  prefixes:
    - name: default
      owner:
        kind: Function
        name: probe
---
apiVersion: funcd.io/v1alpha1
kind: BackupSchedule
metadata:
  name: login-nightly
  namespace: default
  resourceGroup: rg1
spec:
  schedule: 0 3 * * *
  scope:
    addons:
      - login
  target:
    url: s3://backups?endpoint=http://127.0.0.1:18092&region=us-east-1&use_path_style=true
    credentialsSecret: backups-key
  encryption:
    recipients:
      - age1gvngj00ucwlleuk898r0s3umcacr5mxhkv4fy67evygxsmlgpanq43ttm3
      - age1263g0rath75xcgy9wh9cd6p9tpdn6wq35t5fa5pajnna4u7tgyhsxd384c
---
apiVersion: funcd.io/v1alpha1
kind: RolesAssignment
metadata:
  name: probe-reads-backups
  namespace: default
  resourceGroup: rg1
spec:
  principal:
    kind: Function
    name: probe
  assignments:
    - roleRef:
        kind: BuiltinRole
        name: Blob Data Reader
      scope:
        kind: BucketPrefix
        name: backups/default
