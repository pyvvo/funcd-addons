# The addon-infrastack lane's daemon config: the containerd runtime with file storage, the S3 gateway on the bridge for
# the stacks' state, GHCR in addons.registries for the OpenTofu runtime's image, the lane's registries 127.0.0.1:5443
# and 127.0.0.1:5444 for one built locally and for the reconciler's image, and an admin's and a developer's credentials.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
      namespaces:
        - default
runtime:
  mode: containerd
s3gateway:
  enabled: true
  listenAddr: 0.0.0.0:9000
addons:
  registries:
    - ghcr.io
    - 127.0.0.1:5443
    - 127.0.0.1:5444
log:
  format: text
  level: info
