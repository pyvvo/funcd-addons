# A password policy for the IdentityProvider of the lane's App web-auth, which brings that IdentityProvider's own
# Function (ADR-0358 Decision 2).
apiVersion: funcd.io/v1alpha1
kind: RauthyPasswordPolicy
metadata:
  name: web
  namespace: default
  resourceGroup: rg1
spec:
  config:
    provider: web-auth-login
    lengthMin: 12
    lengthMax: 64
