# The lanes of funcd-addons, moved from funcd's scripts/lanes.yaml, whose header names the keys: each runs add-ons on
# a real funcd on containerd in a Lima VM through funcd's lane harness. `just lane <name>` runs one, at the funcd commit
# e2e/funcd.ref names. A path with no module is this repository's, at the commit under test, and FUNCD_LANES_ROOT, its
# root, is in a build's environment; a module's path resolves through funcd's go.mod. The ADRs named here and in the
# suites are funcd's.

addon-rauthy:
  description: An admin registers rauthy, an add-on built outside funcd, from its published image pinned by digest, and a developer's IdentityProvider of it turns Ready on real containerd; the edge serves its /auth/v1/ping at its host with the path kept, answers 404 to its private path however it is spelled, and the engine's netns admits only funcd (ADR-0332).
  # rauthy's App template, with its Addon app/addon.yaml, and its settings Function are rauthy/app and rauthy/settings;
  # the lane's own IdentityProvider, its test keys, the settings Function's manifest, the policies, the template's values
  # and its daemon config are the lane's fixtures.
  dir: rauthy
  stage:
    - app
    - settings
    - from: e2e/lanes/fixtures/addon-rauthy-funcdconfig.yaml
      to: funcdconfig.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-keys.yaml
      to: rauthy-keys.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-login.yaml
      to: login.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-settings.yaml
      to: settings-function.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-policy.yaml
      to: policy.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-web-auth-policy.yaml
      to: web-policy.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-values.yaml
      to: values.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-probe.py
      to: probe.py
  tokens:
    admin: addon-rauthy-lane-admin
    developer: addon-rauthy-lane-developer
  # Only an admin registers an Addon, so the suite applies every manifest itself, and waits for login.
  venom: e2e/lanes/addon-rauthy.venom.yml

addon-rauthy-signin:
  description: The edge signs a user in through rauthy, an add-on built outside funcd, on real containerd (ADR-0335, ADR-0336) — funcd registers the edge's client at rauthy's private path, a navigation is sent to rauthy, the app behind the oidc stance gets the principal headers, a rotation stores a new secret that rauthy takes at once, and a code rauthy refused for the old secret is redeemed with the current one.
  dir: rauthy
  stage:
    - app
    - from: e2e/lanes/fixtures/rauthy-signin-funcdconfig.yaml
      to: funcdconfig.yaml
    # The caller of ADR-0338's case, from pyvvo/funcd-functions.
    - from: apps/addon-caller/caller
      module: github.com/pyvvo/funcd-functions
      to: caller
    - from: apps/addon-caller/fixtures/addon-caller.yaml
      module: github.com/pyvvo/funcd-functions
      to: addon-caller.yaml
    # traefik/whoami answers the headers it gets, behind the oidc stance.
    - from: e2e/lanes/fixtures/rauthy-signin-whoami-addon.yaml
      to: rauthy-signin-whoami-addon.yaml
    - from: e2e/lanes/fixtures/rauthy-signin-objects.yaml
      to: rauthy-signin-objects.yaml
    - from: e2e/lanes/fixtures/rauthy-signin-rotate.yaml
      to: rauthy-signin-rotate.yaml
  # The admin token registers the Addons; the suite applies everything itself, so the lane has no ready gate.
  tokens:
    admin: rauthy-signin-lane-admin
    developer: rauthy-signin-lane-developer
  venom: e2e/lanes/addon-rauthy-signin.venom.yml

addon-rauthy-restore:
  description: rauthy, an add-on built outside funcd, backed up from its own hiqlite snapshots to an S3 server in the VM and restored in place on real containerd (ADR-0333) — a client registered before the Backup is kept and one after it is gone, through two engine starts under the hold; then funcd is killed while rauthy starts with restore.env, and the next start ends the Restore Interrupted, keeps the hold, and runs rauthy without restore.env.
  # rauthy's Addon is rauthy/app/addon.yaml; the lane's IdentityProvider, its backups and its daemon config are the
  # lane's fixtures, the S3 server's key and the workload Secrets the todo App's test fixtures in pyvvo/funcd-functions.
  # versitygw (Apache-2.0), the S3 server, is built for the VM at funcd's app-todo lane's pinned version, in a writable
  # copy of rauthy/.
  dir: rauthy
  copy: true
  build:
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) GOBIN= go install github.com/versity/versitygw/cmd/versitygw@v1.9.0 && cp "$(go env GOPATH)/bin/linux_$(go env GOARCH)/versitygw" versitygw
  stage:
    - app
    - versitygw
    - from: e2e/lanes/fixtures/addon-rauthy-funcdconfig.yaml
      to: funcdconfig.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-keys.yaml
      to: rauthy-keys.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-restore-login.yaml
      to: login.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-restore-client.json
      to: client.json
    - from: e2e/lanes/fixtures/addon-rauthy-restore-backup.yaml
      to: backup.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-restore-b1.yaml
      to: b1.yaml
    - from: e2e/lanes/fixtures/addon-rauthy-restore-in-place.yaml
      to: restore-in-place.yaml
    - from: apps/todo/dr/versitygw.env
      module: github.com/pyvvo/funcd-functions
      to: dr/versitygw.env
    - from: apps/todo/dr/workload-secrets.yaml
      module: github.com/pyvvo/funcd-functions
      to: dr/workload-secrets.yaml
  tokens:
    admin: addon-rauthy-restore-lane-admin
    developer: addon-rauthy-restore-lane-developer
  # Only an admin registers an Addon and restores in place, so the suite applies every manifest itself.
  venom: e2e/lanes/addon-rauthy-restore.venom.yml

addon-infrastack:
  description: pyvvo/funcd-addons' InfraStack add-on on real containerd (ADR-0344, ADR-0345, ADR-0348, ADR-0349, ADR-0355, ADR-0356) — an admin registers the add-on's Addon, which ships the OpenTofu runtime and the Engineless kind InfraStack; the add-on's plugin pushes the example modules from the VM on Docker; a run whose variables break the module's contract is refused; the example stack previews, is approved, applies with its state in a Bucket prefix through the S3 gateway and turns Ready, a Function reads its outputs from the Secret its Job owns and sees a later apply's value, a sensitive output is in no status, log or plugin line, and once deleted the stack is held until its approved destroy succeeded; a second stack's module takes its sensitive variable from a Secret its Job binds.
  # The add-on's files are this repository's, at the commit under test. The build makes the OpenTofu runtime's image
  # from infrastack/runtime with the add-on's own recipe, run at FUNCD_LANES_ROOT, and the shim its pins.json names, so
  # the runs and the plugin use the runtime under test whatever image the Addon pins; funcd's e2e/laneregistry serves it
  # in the VM. The build writes opentofu.tar into the lane's dir, so the lane builds in a writable copy of
  # infrastack/examples, inside funcd's checkout.
  dir: infrastack/examples
  copy: true
  build:
    - here=$PWD && cd "$FUNCD_LANES_ROOT" && just opentofu-image "" funcd-lane/opentofu:lane && docker save funcd-lane/opentofu:lane | gzip -1n > "$here/opentofu.tar"
  stage:
    - random-stack
    - random-stack.yaml
    - random-stack-reader.mjs
    - random-stack-reader.contract.yaml
    - random-stack-reader.yaml
    - token-stack
    - token-stack.yaml
    - opentofu.tar
    - from: infrastack/app/addon.yaml
      to: addon.yaml
    - from: infrastack/plugin/funcdctl-infra
      to: funcdctl-infra
    - from: infrastack/reconciler/infrastack-reconciler.mjs
      to: infrastack-reconciler.mjs
    - from: infrastack/reconciler/infrastack-reconciler.contract.yaml
      to: infrastack-reconciler.contract.yaml
    - from: e2e/lanes/fixtures/addon-infrastack-funcdconfig.yaml
      to: funcdconfig.yaml
  tokens:
    admin: addon-infrastack-lane-admin
    developer: addon-infrastack-lane-developer
  # The suite pushes the modules with the add-on's plugin.
  push:
    - artifact: infrastack-reconciler.mjs
      ref: infrastack-reconciler
    - artifact: random-stack-reader.mjs
      ref: random-stack-reader
  venom: e2e/lanes/addon-infrastack.venom.yml

addon-frp-bunny:
  description: funcd-functions' frp-bunny App on real containerd with egress on and no spend (ADR-0345, ADR-0352, ADR-0353, ADR-0356) — the fake module in place of Bunny's, a local frps on the bridge over websocket, and pyvvo/funcd-addons' InfraStack and Tunnel Addons; the App's stack previews, is approved and applies, the Tunnel's engine is replaced with the FRP_TOKEN that the apply writes into the outputs Secret, its frpc dials frps with it through the egress gateway, a call to frps with the public host reaches the hello Function through frpc and the edge, and the App's deletion waits for the stack's approved destroy.
  # The App comes from the funcd-functions module that funcd's go.mod pins, and the add-ons' files from this repository.
  # The build makes the OpenTofu runtime's image with this repository's recipe, as the addon-infrastack lane does, and
  # funcd's e2e/laneregistry serves it in the VM; the Tunnel Addon pulls its image from GHCR by the digest it pins,
  # unless the lane also stages tunnel.tar. frps is fatedier/frps's binary, by digest.
  module: github.com/pyvvo/funcd-functions
  dir: apps/frp-bunny
  copy: true
  build:
    - id=$(docker create --platform "linux/$(go env GOARCH)" fatedier/frps:v0.72.0@sha256:17abb20dd392557a44070d9726954630c0eb1f7a9bd6ead5ae9150d165179ea4) && docker cp "$id":/usr/bin/frps frps && docker rm "$id"
    - here=$PWD && cd "$FUNCD_LANES_ROOT" && just opentofu-image "" funcd-lane/opentofu:lane && docker save funcd-lane/opentofu:lane | gzip -1n > "$here/opentofu.tar"
  stage:
    - app
    - infra/fake
    - hello
    - values/lane.yaml
    - frps
    - opentofu.tar
    - from: infrastack/app/addon.yaml
      to: opentofu-addon.yaml
    - from: tunnel/app/addon.yaml
      to: tunnel-addon.yaml
    - from: infrastack/reconciler/infrastack-reconciler.mjs
      to: infrastack-reconciler.mjs
    - from: infrastack/reconciler/infrastack-reconciler.contract.yaml
      to: infrastack-reconciler.contract.yaml
    - from: e2e/lanes/fixtures/frp-bunny/funcdconfig.yaml
      to: funcdconfig.yaml
    - from: e2e/lanes/fixtures/frp-bunny/secrets.yaml
      to: secrets.yaml
    - from: e2e/lanes/fixtures/frp-bunny/egress.yaml
      to: egress.yaml
  tokens:
    admin: addon-frp-bunny-lane-admin
    developer: addon-frp-bunny-lane-developer
  venom: e2e/lanes/addon-frp-bunny.venom.yml

addon-frp-bunny-live:
  description: funcd-functions' frp-bunny App against Bunny itself, which spends (about $0.47 a month while it runs) — the addon-frp-bunny lane with infra/bunny in place of the fake module, the API key from the file VENOM_VAR_bunnykeyfile names, and the pull zone VENOM_VAR_bunnyname; the public name answers through Bunny, and the stack's approved destroy removes what it created.
  # Never in lima-example-all: its suite refuses to deploy unless its operator names the pull zone, the Magic Containers
  # registry Id and the key file.
  optional: true
  module: github.com/pyvvo/funcd-functions
  dir: apps/frp-bunny
  stage:
    - app
    - infra/bunny
    - hello
    - values/bunny.yaml
    - egress.yaml
    - from: infrastack/app/addon.yaml
      to: opentofu-addon.yaml
    - from: tunnel/app/addon.yaml
      to: tunnel-addon.yaml
    - from: infrastack/reconciler/infrastack-reconciler.mjs
      to: infrastack-reconciler.mjs
    - from: infrastack/reconciler/infrastack-reconciler.contract.yaml
      to: infrastack-reconciler.contract.yaml
    - from: e2e/lanes/fixtures/frp-bunny/funcdconfig.yaml
      to: funcdconfig.yaml
    - from: e2e/lanes/fixtures/frp-bunny/live-outputs.yaml
      to: live-outputs.yaml
  tokens:
    admin: addon-frp-bunny-live-lane-admin
    developer: addon-frp-bunny-live-lane-developer
  venom: e2e/lanes/addon-frp-bunny-live.venom.yml
