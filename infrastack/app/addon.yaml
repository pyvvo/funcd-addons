apiVersion: funcd.io/v1alpha1
kind: Addon
metadata:
  name: infrastack
spec:
  runtimes:
    # OpenTofu for the stacks' Jobs (funcd ADR-0344): funcd's Python shim with the handler of runtime/, which plans in a
    # run's preview and applies only the approved saved plan (funcd ADR-0348). The release workflow publishes the
    # image, whose multi-arch digest from v0.5.0 is pinned here.
    - name: opentofu1
      image: ghcr.io/pyvvo/funcd-opentofu@sha256:ea7f035a7deb67fd5b301b70f95af069369fc84994d714fbc2e3bad9a1771b91
      workloads:
        - Job
    # The InfraStack kind runs no engine (funcd ADR-0345): the Function of reconciler/ drives each stack's Job.
    - name: infrastack
      workloads:
        - Engineless
      attributes:
        kind: InfraStack
        resync: 1m
        function:
          ref: infrastack-reconciler
        config:
          type: object
          additionalProperties: false
          properties:
            job:
              type: string
            variables: {}
            # A cron of funcd ADR-0211's grammar, in UTC: when the reconciler checks an applied stack for drift.
            drift:
              type: string
          required:
            - job
