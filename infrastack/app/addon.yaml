apiVersion: funcd.io/v1alpha1
kind: Addon
metadata:
  name: infrastack
spec:
  runtimes:
    # OpenTofu for the stacks' Jobs (funcd ADR-0344): funcd's Python shim with the handler of runtime/, which plans in a
    # run's preview and applies only the approved saved plan (funcd ADR-0348). The release workflow publishes the
    # image, whose multi-arch digest from v0.8.1 is pinned here.
    - name: opentofu1
      image: ghcr.io/pyvvo/funcd-opentofu@sha256:7840e234607a768a5a7f4276c929f9688fa0d3c9002552d27eac284b293ac0a1
      workloads:
        - Job
    # The InfraStack kind runs no engine (funcd ADR-0345): the Function of reconciler/ drives the Job that a stack binds as
    # stack. The release workflow publishes it as this image, and funcd creates one for each stack (funcd ADR-0358).
    - name: infrastack
      workloads:
        - Engineless
      attributes:
        kind: InfraStack
        resync: 1m
        function:
          image: ghcr.io/pyvvo/funcd-infrastack-reconciler@sha256:62e175360e13d22297df421b228ddb53d676f52c35c303795723bf7954f091b5
