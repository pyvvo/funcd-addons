apiVersion: funcd.io/v1alpha1
kind: Addon
metadata:
  name: infrastack
spec:
  runtimes:
    # OpenTofu for the stacks' Jobs (funcd ADR-0344): funcd's Python shim with the handler of runtime/, which plans in a
    # run's preview and applies only the approved saved plan (funcd ADR-0348). The release workflow publishes the
    # image; a follow-up pins its digest.
    - name: opentofu1
      image: ghcr.io/pyvvo/funcd-opentofu@sha256:TODO-pin-after-the-first-release
      workloads:
        - Job
    # The InfraStack kind runs no engine (funcd ADR-0345): the Function of reconciler/ drives each stack's Job.
    - name: infrastack
      workloads:
        - Engineless
      attributes:
        kind: InfraStack
        resync: 1m
        function:
          ref: infrastack-reconciler
        config:
          type: object
          additionalProperties: false
          properties:
            job:
              type: string
            variables: {}
          required:
            - job
