name: infrastack
version: 0.1.0
registry: ${{ values.registry }}
images:
  reconciler: infrastack-reconciler:0.1.0
valuesSchema:
  type: object
  properties:
    registry:
      type: string
    module:
      type: string
    variables:
      type: object
      default: {}
    bypass:
      type: boolean
      default: false
  required:
    - registry
    - module
