buckets:
  - name: ${{ app.name + "-state" }}
    prefixes:
      - name: state
        owner:
          kind: Job
          name: ${{ app.name }}
configMaps:
  - name: ${{ app.name + "-infrastack" }}
    data:
      INFRASTACK_STATE_BUCKET: ${{ app.name + "-state" }}
      INFRASTACK_STATE_PREFIX: state
      INFRASTACK_OUTPUTS_SECRET: ${{ app.name + "-outputs" }}
secrets:
  - name: ${{ app.name + "-outputs" }}
    keys: []
jobs:
  - name: ${{ app.name }}
    runtime: opentofu1
    handler: handle
    image: ${{ values.module }}
    timeout: 30m
    resources:
      memory: 512Mi
    approval:
      bypass: ${{ values.bypass }}
    bindings:
      blob:
        - alias: state
          bucket: ${{ app.name + "-state" }}
          prefix: state
      config:
        - ${{ app.name + "-infrastack" }}
      secret:
        - ${{ app.name + "-outputs" }}
functions:
  - name: ${{ app.name + "-reconciler" }}
    runtime: nodejs22
    handler: reconcile
    image: ${{ images.reconciler }}
    bindings:
      job:
        - alias: ${{ app.name }}
          job: ${{ app.name }}
addons:
  - name: ${{ app.name }}
    kind: InfraStack
    deletion: delete
    config:
      job: ${{ app.name }}
      variables: ${{ values.variables }}
    functions:
      - kind: InfraStack
        ref: ${{ app.name + "-reconciler" }}
