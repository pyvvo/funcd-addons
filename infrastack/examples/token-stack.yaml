# One stack whose module takes its sensitive variable token from a Secret: the token-stack module, pushed with
# funcdctl infra push token-stack <ref>, whose contract leaves token out, so a run whose variables set it is refused.
# OpenTofu reads it from TF_VAR_token, a key of the Secret token-stack-token that the Job binds (funcd ADR-0355
# Decision 3). The state has a Bucket of its own, and the ConfigMap names no outputs Secret, so the plain output is in
# the run's result alone.
apiVersion: funcd.io/v1alpha1
kind: Bucket
metadata:
  name: token-stack-state
  namespace: default
  resourceGroup: default
spec:
  prefixes:
    - name: stack
      owner:
        kind: Job
        name: token-stack
---
apiVersion: funcd.io/v1alpha1
kind: ConfigMap
metadata:
  name: token-stack-infrastack
  namespace: default
  resourceGroup: default
spec:
  data:
    INFRASTACK_STATE_BUCKET: token-stack-state
    INFRASTACK_STATE_PREFIX: stack
---
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: token-stack-token
  namespace: default
  resourceGroup: default
spec:
  # Replace the value with the token in base64.
  data:
    TF_VAR_token: UkVQTEFDRS1NRQ==
---
apiVersion: funcd.io/v1alpha1
kind: Job
metadata:
  name: token-stack
  namespace: default
  resourceGroup: default
spec:
  runtime: opentofu1
  handler: handle
  image: registry.example.com/token-stack:0.1.0
  timeout: 10m
  resources:
    memory: 512Mi
  buckets:
    - ref: token-stack-state
  configMaps:
    - ref: token-stack-infrastack
  secrets:
    - name: token-stack-token
      keys:
        - TF_VAR_token
  bindings:
    blob:
      - alias: state
        bucket: token-stack-state
        prefix: stack
    config:
      - token-stack-infrastack
    secret:
      - token-stack-token
---
apiVersion: funcd.io/v1alpha1
kind: InfraStack
metadata:
  name: token-stack
  namespace: default
  resourceGroup: default
spec:
  deletion: delete
  bindings:
    job:
      - alias: stack
        job: token-stack
  config:
    variables:
      prefix: example
