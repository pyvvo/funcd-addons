name: Release

# release-please keeps a release PR open on main. Merging it tags v<version>; then the CI and the e2e run on that tag,
# and each add-on's app/addon.yaml (as <addon>.yaml) and each plugin, for Linux and macOS, are attached to the release,
# funcdctl-infra stamped with the opentofu1 image of the Addon beside it, and the add-ons' images are pushed to GHCR for
# linux/amd64 and linux/arm64, tagged <version>.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows. A token from the funcd release GitHub App does; until the
      # app is configured for this repository, release-please falls back to GITHUB_TOKEN.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  check:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  assets:
    needs:
      - release-please
      - check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the plugins and collect the Addons
        run: |
          set -euo pipefail
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            nix develop --command just plugins "${p%/*}" "${p#*/}"
          done
          mkdir -p release
          for d in */app/addon.yaml; do
            # An Addon whose image the images job publishes in this release is pinned by a follow-up.
            if grep -q '@sha256:TODO' "$d"; then echo "skip $d: an image of it is not pinned yet"; continue; fi
            cp "$d" "release/${d%%/*}.yaml"
          done
          # funcdctl-infra runs OpenTofu in the opentofu1 image of the Addon it ships beside (funcd ADR-0355 Decision 1).
          if [ -f release/infrastack.yaml ]; then nix develop --command just infra-plugin release/funcdctl-infra; fi
          for f in dist/*/*; do
            tar -czf "release/$(basename "$f")-$(basename "$(dirname "$f")").tar.gz" -C "$(dirname "$f")" "$(basename "$f")"
          done
          (cd release && sha256sum * > SHA256SUMS)

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release/* --clobber

  # Each image is built from the tag for both platforms and pushed as one index; the summary lists each index's digest,
  # which a follow-up pins in the Addon. A package that a first push creates is private until it is made public.
  images:
    needs:
      - release-please
      - check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the images
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          build() {
            name=$1 context=$2
            shift 2
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=315532800 \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.version=$version" \
              --tag "ghcr.io/pyvvo/$name:$version" --metadata-file "$name.json" --push "$@" "$context"
            echo "ghcr.io/pyvvo/$name@$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$name.json")" >> "$GITHUB_STEP_SUMMARY"
          }
          shim=$(nix develop --command just opentofu-shim)
          build funcd-opentofu infrastack/runtime --build-context "shim=$shim/shim" -f infrastack/runtime/Dockerfile
          if [ -d tunnel/image ]; then build funcd-tunnel tunnel/image; fi
