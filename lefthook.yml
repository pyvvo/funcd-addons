# Git hooks, installed by the dev shell (`nix develop`). `just ci` runs the same checks, so a commit that passes here
# does not fail there on its Go formatting or its README.
pre-commit:
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    readme:
      glob: "*README.md"
      run: python3 scripts/readme-check.py {staged_files}
