name: rauthy
version: 0.2.0
registry: ${{ values.registry }}
images:
  settings: rauthy-settings:0.2.0
valuesSchema:
  type: object
  properties:
    registry:
      type: string
    host:
      type: string
    publicHost:
      type: string
      default: ""
    https:
      type: boolean
      default: true
    keys:
      type: string
      default: rauthy-keys
  required:
    - registry
    - host
