secrets:
  - name: ${{ values.keys }}
    keys:
      - BOOTSTRAP_API_KEY_SECRET
addons:
  - name: ${{ app.name + "-login" }}
    kind: IdentityProvider
    config:
      publicHost: '${{ values.publicHost !== "" ? values.publicHost : values.host }}'
      rpId: ${{ values.host }}
      https: ${{ values.https }}
    bindings:
      secret:
        - ${{ values.keys }}
    ingress:
      host: ${{ values.host }}
